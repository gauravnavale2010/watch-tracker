name: HMT Store Diagnostic

on:
  workflow_dispatch:

jobs:
  debug-store:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Find HMT Store Product Data
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://www.hmtwatches.store/collections/all"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/120.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9",
              "Cache-Control": "no-cache",
          }

          print("=" * 70)
          print("HMT STORE DATA DIAGNOSTIC")
          print("=" * 70)

          try:
              response = requests.get(
                  url,
                  headers=headers,
                  timeout=30
              )

              html = response.text

              print("STATUS:", response.status_code)
              print("FINAL URL:", response.url)
              print("HTML LENGTH:", len(html))

          except Exception as e:
              print("REQUEST ERROR:", e)
              raise

          # --------------------------------------------------
          # NEXT.JS / APPLICATION DATA
          # --------------------------------------------------

          print()
          print("NEXT.JS / APPLICATION DATA")
          print("=" * 70)

          next_patterns = [
              "__NEXT_DATA__",
              "_next/data",
              "buildId",
              "pageProps",
              "initialState",
              "initialData",
              "__APOLLO_STATE__",
              "getServerSideProps",
              "getStaticProps",
          ]

          html_lower = html.lower()

          for pattern in next_patterns:
              print(
                  f"{pattern}: "
                  f"{pattern.lower() in html_lower}"
              )

          # --------------------------------------------------
          # ALL URLS THAT LOOK INTERESTING
          # --------------------------------------------------

          print()
          print("POSSIBLE API / PRODUCT URLS")
          print("=" * 70)

          urls = set(
              re.findall(
                  r'https?://[^"\'\s<>]+',
                  html
              )
          )

          interesting_urls = []

          for u in urls:

              clean_url = (
                  u.replace("\\/", "/")
                   .replace("&amp;", "&")
              )

              ul = clean_url.lower()

              if any(
                  keyword in ul
                  for keyword in [
                      "api",
                      "product",
                      "catalog",
                      "collection",
                      "inventory",
                      "smartbiz",
                      "amazon",
                      "stock",
                      "item",
                  ]
              ):
                  interesting_urls.append(
                      clean_url
                  )

          for u in sorted(
              interesting_urls
          ):
              print(u[:1000])

          print(
              f"\nInteresting URLs found: "
              f"{len(interesting_urls)}"
          )

          # --------------------------------------------------
          # PRODUCT DATA KEYWORDS
          # --------------------------------------------------

          print()
          print("PRODUCT DATA KEYWORDS")
          print("=" * 70)

          keywords = [
              "productId",
              "product_id",
              "productName",
              "product_name",
              "productTitle",
              "product_title",
              "productCode",
              "product_code",
              "inventory",
              "quantity",
              "availableQuantity",
              "available_quantity",
              "stock",
              "stockQuantity",
              "stock_quantity",
              "variants",
              "price",
              "sellingPrice",
              "selling_price",
              "mrp",
              "sku",
              "items",
              "products",
              "catalog",
              "catalogue",
          ]

          for keyword in keywords:

              count = html_lower.count(
                  keyword.lower()
              )

              print(
                  f"{keyword}: {count}"
              )

          # --------------------------------------------------
          # SEARCH FOR PRODUCT-LIKE URL PATHS
          # --------------------------------------------------

          print()
          print("PRODUCT-LIKE PATHS")
          print("=" * 70)

          paths = set(
              re.findall(
                  r'["\']([^"\']{1,500})["\']',
                  html
              )
          )

          product_paths = []

          for path in paths:

              path_lower = path.lower()

              if any(
                  keyword in path_lower
                  for keyword in [
                      "/product",
                      "/products",
                      "productid",
                      "product_id",
                      "productname",
                      "product_name",
                      "/item",
                      "/items",
                      "/catalog",
                      "/inventory",
                      "/stock",
                  ]
              ):

                  product_paths.append(path)

          for path in sorted(
              set(product_paths)
          )[:100]:

              print(path[:1000])

          print(
              f"\nProduct-like paths found: "
              f"{len(product_paths)}"
          )

          # --------------------------------------------------
          # PRODUCT DATA SNIPPETS
          # --------------------------------------------------

          print()
          print("PRODUCT DATA SNIPPETS")
          print("=" * 70)

          search_terms = [
              "productId",
              "productName",
              "productTitle",
              "sellingPrice",
              "inventory",
              "quantity",
              "availableQuantity",
              "stock",
              "sku",
              "variants",
          ]

          shown = 0

          for term in search_terms:

              start = 0

              while True:

                  pos = html_lower.find(
                      term.lower(),
                      start
                  )

                  if pos == -1:
                      break

                  snippet_start = max(
                      0,
                      pos - 700
                  )

                  snippet_end = min(
                      len(html),
                      pos + 1800
                  )

                  snippet = html[
                      snippet_start:snippet_end
                  ]

                  print()
                  print(
                      f"--- MATCH: {term} ---"
                  )
                  print(snippet)

                  shown += 1

                  if shown >= 15:
                      break

                  start = pos + len(term)

              if shown >= 15:
                  break

          # --------------------------------------------------
          # SCRIPT TAG INFORMATION
          # --------------------------------------------------

          print()
          print("SCRIPT TAG SOURCES")
          print("=" * 70)

          script_sources = re.findall(
              r'<script[^>]+src=["\']([^"\']+)',
              html,
              re.I
          )

          for src in script_sources:

              print(src)

          print(
              f"\nScript sources found: "
              f"{len(script_sources)}"
          )

          # --------------------------------------------------
          # END
          # --------------------------------------------------

          print()
          print("=" * 70)
          print("END DIAGNOSTIC")
          print("=" * 70)

          PY
